[package]
name = "prism-proxy"
version = "0.4.0"
description = "Prism - A modern cross-platform proxy client"
authors = ["Prism Team"]
license = "GPL-3.0"
repository = "https://github.com/your-org/prism"
edition = "2024"
rust-version = "1.85"

# 修复 time/num_threads 在 aarch64-apple-ios 交叉编译时报错：
# num_threads 0.1.7 的 apple.rs 调用了 libc::mach_task_self()，
# 但 libc >= 0.2.155 在 iOS 目标上移除了该符号导出。
# 采用本地 vendored 副本，通过 extern "C" 手动声明该系统符号解决。
[patch.crates-io]
num_threads = { path = "vendor/num_threads" }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

# Tauri 移动端（Android/iOS）需要 lib 以 staticlib/cdylib 输出，
# 名称与 main.rs 中 prism_proxy_lib::run() 对应
[lib]
name = "prism_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"

# Async runtime & networking
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
# 移动端必须用 rustls：native-tls 在 Android 上依赖 OpenSSL，交叉编译受阻
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls", "socks"] }
# 订阅下载：面板无视 Accept-Encoding: identity 强制返回 gzip 时手动解压
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# IPC / RPC
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"

# Misc
anyhow = "1.0"
base64 = "0.22"
# 【APP59 任务1】Go Lan 跨 VLAN 直连判定：仅在网络切换瞬间单次绑定物理
# Wi-Fi 源 IP 做 150ms TCP 可达性校验（非轮询，日常 0 网络开销）
socket2 = "0.6"
thiserror = "1.0"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
# 授权缓存加密（AES-256-GCM + SHA-256 密钥派生）：防逆向读取与篡改
aes-gcm = "0.10"
sha2 = "0.10"
# 【110.txt】Ed25519 签名验签（严格模式 verify_strict）：授权令牌 / 运行策略 /
# 订阅链接统一走同一套公钥验签，任何篡改 payload 或 signature 都会直接降级
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
# 【110.txt】TLS SPKI 证书 pinning：只信任 prism.sarl 服务端当前证书的 SPKI；
# 真正的 pinning 逻辑在 reqwest client 层通过自定义 TLS connector 完成。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
once_cell = "1.19"
parking_lot = "0.12"
bytes = "1.5"
# Go Cus：URL 改写规则匹配 + 自签名 Root CA（纯 Rust，ring 后端）
regex = "1"
rcgen = "0.13"
time = { version = "0.3", default-features = false, features = ["std", "local-offset", "formatting", "macros"] }

# TUN / networking (platform-gated)
tun = { version = "0.6", optional = true }

# Plugin / WASM runtime (optional future extensibility)
wasmtime = { version = "18.0", optional = true }
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }

# Platform-specific networking（必须放在普通 dependencies 之后，
# 否则其后的裸键会被归入 target 专属表）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Services",
] }
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

# 移动端 IAP（桌面构建不编译）：前端 tauri-plugin-iap-api 经此插件发起购买
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-iap = "0.9"

# Android VPN 承载：Rust 经 JNI 驱动 Kotlin VpnService
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
tun-mode = ["dep:tun"]
wasm-plugins = ["dep:wasmtime"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
