name: Mobile Build

# 推送 main / tag v* / 手动触发：产出 Android APK 与 TrollStore（巨魔）未签名 IPA
# tag 触发时额外把 APK/IPA 作为 Release asset 上传，与桌面端（build.yml）共用同一 Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      # init / build 两个步骤都要通过 NDK_HOME 找到 NDK；
      # 路径为 GitHub Ubuntu runner 标准 SDK 位置（不用 env 上下文：
      # 它不包含系统级环境变量）
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      # ubuntu-24.04 runner 可用空间仅 ~14GB，而本 job 需要同时承载
      # 4 个 Android target 的 Rust release 构建 + NDK + Go 内核 + Gradle，
      # 峰值远超于此（此前连续多次因 "No space left on device" 失败，
      # 且 runner 磁盘写满时连失败日志都无法落盘）。job 开始时定点
      # 清除构建用不到的预装大型工具链，可释放 ~20GB。
      - name: Free disk space
        shell: bash
        run: |
          set +e
          echo "--- disk before ---"; df -h / | tail -1
          # 预装 Docker 镜像（~4GB）
          sudo docker image prune -af >/dev/null 2>&1
          # 预装工具链：dotnet / boost / ghc / CodeQL / PyPy / vcpkg /
          # 系统级 Go（setup-go 自装 1.23，与预装无关）
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /usr/local/go \
            "$VCPKG_INSTALLATION_ROOT"
          # 预装 Android SDK 中 APK 构建用不到的部分：
          # 模拟器镜像 / system-images / ndk-bundle / 遗留 tools 包
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/ndk-bundle \
            /usr/local/lib/android/sdk/tools
          # 多余的 NDK / build-tools / platforms：仅保留本项目所用版本
          sudo find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 \
            ! -name "27.2.12479018" -exec rm -rf {} +
          sudo find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 \
            ! -name "34.0.0" ! -name "35.0.0" -exec rm -rf {} +
          sudo find /usr/local/lib/android/sdk/platforms -mindepth 1 -maxdepth 1 \
            ! -name "android-34" ! -name "android-35" -exec rm -rf {} +
          sudo apt-get clean
          echo "--- disk after ---"; df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # APK-3：仅构建 aarch64（arm64-v8a）真机架构。同时编译 armv7/i686/
      # x86_64 四个架构是 17 分钟构建瓶颈的主要来源；32 位与模拟器不在
      # 分发范围内，单架构可将 Android 构建压缩到 6 分钟量级
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已从仓库移除的遗留 "tools" 包会直接失败，必须显式指定
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: src-tauri/ios-kernel/go.sum

      # Pre-build 步骤里 export 的 CC_* 只在该步骤的 shell 内有效（GitHub Actions
      # 步骤间不保留 shell 环境变量），而 Build APK 时是 Gradle 在全新进程里调
      # cargo：ring 等带 C 源码的 crate 会重新执行 build script，cc-rs 探测
      # 不到 NDK r23+ 已移除的无 API 级别后缀 aarch64-linux-android-clang
      # （ring 的 rerun-if-env 指纹从"已设置"变"未设置"也会触发重编译）。
      # 写入 CARGO_HOME/config.toml 后对任意 cwd 的 cargo 调用都生效。
      - name: Configure cargo NDK toolchain globally
        shell: bash
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CFG="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$CFG")"
          if grep -q "prism-android-ndk" "$CFG" 2>/dev/null; then
            echo "NDK toolchain already configured"
            exit 0
          fi
          cat >> "$CFG" <<EOF

          # prism-android-ndk
          [target.aarch64-linux-android]
          linker = "$BIN/aarch64-linux-android24-clang"
          [target.armv7-linux-androideabi]
          linker = "$BIN/armv7a-linux-androideabi24-clang"
          [target.i686-linux-android]
          linker = "$BIN/i686-linux-android24-clang"
          [target.x86_64-linux-android]
          linker = "$BIN/x86_64-linux-android24-clang"

          [env]
          CC_aarch64_linux_android = "$BIN/aarch64-linux-android24-clang"
          CXX_aarch64_linux_android = "$BIN/aarch64-linux-android24-clang++"
          AR_aarch64_linux_android = "$BIN/llvm-ar"
          CC_armv7_linux_androideabi = "$BIN/armv7a-linux-androideabi24-clang"
          CXX_armv7_linux_androideabi = "$BIN/armv7a-linux-androideabi24-clang++"
          AR_armv7_linux_androideabi = "$BIN/llvm-ar"
          CC_i686_linux_android = "$BIN/i686-linux-android24-clang"
          CXX_i686_linux_android = "$BIN/i686-linux-android24-clang++"
          AR_i686_linux_android = "$BIN/llvm-ar"
          CC_x86_64_linux_android = "$BIN/x86_64-linux-android24-clang"
          CXX_x86_64_linux_android = "$BIN/x86_64-linux-android24-clang++"
          AR_x86_64_linux_android = "$BIN/llvm-ar"
          EOF
          cat "$CFG"

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      # 注入系统 VPN 原生组件：PrismVpnBridge / PrismVpnService（Kotlin）、
      # MainActivity 桥接与 AndroidManifest 权限/Service 声明（幂等）。
      # 脚本同时关闭 Release R8（isMinifyEnabled/isShrinkResources/
      # optimization.enable → false）并以无 BOM UTF-8 重写 proguard-rules.pro
      - name: Inject Android VPN components
        run: node scripts/inject-android-vpn.cjs

      # APK-3 保险：注入脚本已关闭 R8，此处再强制兜底一次（两种 DSL 写法
      # 都覆盖），防止 CI 环境中 build.gradle.kts 被重新生成或覆盖后
      # :app:minifyUniversalReleaseWithR8 复活导致构建失败
      - name: Force-disable R8 minify (belt & suspenders)
        shell: bash
        run: |
          set -e
          F=src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' "$F"
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' "$F"
          sed -i '/optimization/,/}/ s/enable = true/enable = false/' "$F"
          echo "--- release buildType ---"
          sed -n '/getByName("release")/,/^        }/p' "$F"
          # 首字节 BOM 校验：proguard-rules.pro 绝不允许 0xEF 开头
          head -c1 src-tauri/gen/android/app/proguard-rules.pro | od -An -tx1

      # tauri android init 只放置模板自带图标，不会把 src-tauri/icons/android
      # 同步进 gen 工程；这里用定制的满幅海军蓝图标覆盖 mipmap/values/anydpi
      - name: Sync Android launcher icons
        run: |
          set -e
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$RES"
          cp -rfv src-tauri/icons/android/. "$RES"/ | tail -20
          echo "--- ic_launcher_background ---"
          cat "$RES/values/ic_launcher_background.xml"

      # Pre-build 直接跑 cargo，tauri::generate_context! 需要 frontendDist(../dist)
      # 已存在；先执行与 tauri build 相同的 beforeBuildCommand
      - name: Build frontend
        run: npm run build

      # geoip/geosite 数据库在 Android 上于编译期 include_bytes! 内嵌
      # （kernel.rs），cargo 构建前必须就位；终端用户无需联网下载
      - name: Fetch geo databases
        run: node scripts/fetch-kernel.cjs --geo-only

      # Android 内核与 iOS 同为进程内承载，但 Go 在 android 上不支持 c-archive，
      # 改用 c-shared 产出 .so，build.rs 以 dylib 方式链接；.so 还需拷入
      # gen/android/.../jniLibs/<abi>/ 才能被 APK 打包并在运行时加载。
      # 不再有 sidecar，也不存在任何运行时内核下载
      - name: Build embedded Android kernels
        working-directory: src-tauri/ios-kernel
        shell: bash
        run: |
          set -e
          go mod tidy
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build() {
            arch="$1"; goarch="$2"; cc="$3"; target="$4"
            CGO_ENABLED=1 GOOS=android GOARCH="$goarch" \
              CC="$BIN/$cc" \
              CGO_CFLAGS="--target=$target" \
              CGO_LDFLAGS="--target=$target" \
              go build -buildmode=c-shared \
                -tags "with_gvisor,with_quic,with_grpc,with_wireguard,with_ech,with_utls,with_clash_api" \
                -trimpath -ldflags="-s -w" \
                -o "libprismkernel-$arch.so" .
          }
          # APK-3：仅构建 arm64（与 Rust target 单架构化一致），
          # 32 位与 x86_64 模拟器不在分发范围内
          build arm64  arm64 aarch64-linux-android24-clang       aarch64-linux-android24
          ls -lh libprismkernel-*.so

      # 将 .so 拷入 Tauri Android 工程的 jniLibs，确保被打包进 APK
      - name: Stage Android kernel .so into jniLibs
        shell: bash
        run: |
          set -e
          JNI="src-tauri/gen/android/app/src/main/jniLibs"
          mkdir -p "$JNI/arm64-v8a"
          cp src-tauri/ios-kernel/libprismkernel-arm64.so "$JNI/arm64-v8a/"
          ls -lhR "$JNI"

      # Gradle rust 插件会把 cargo 详细输出重定向到文件，失败时控制台只见
      # "Process 'command 'npm'' finished with non-zero exit value 1"。
      # 先用 cargo 直接构建全部目标（与 Tauri 调用等价：--lib --release）：
      # - 错误行转成 workflow error annotation（check-runs API 可读）
      # - 完整日志在失败时作为 artifact 上传
      # 同时预热 cargo 缓存。
      - name: Pre-build Rust for all Android targets
        id: prebuild
        shell: bash
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          failed=0

          build() {
            triple="$1"
            cc_name="$2"
            upper="$(echo "$triple" | tr 'a-z-' 'A-Z_')"
            export "CC_${upper}"="$BIN/$cc_name"
            export "CXX_${upper}"="$BIN/$cc_name"
            export "AR_${upper}"="$BIN/llvm-ar"
            export "CARGO_TARGET_${upper}_LINKER"="$BIN/$cc_name"

            logf="src-tauri/cargo-${triple}.log"
            echo "::group::cargo build $triple"
            set +e
            cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target "$triple" 2>&1 | tee "$logf"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              failed=1
              # 提取关键错误行为注解（每行一个，限制 40 行）
              grep -E 'error(\[E[0-9]+\])?[: ]|undefined (symbol|reference)|ld(\.lld)?: error|cannot find -l|note: .*' "$logf" \
                | head -40 | while IFS= read -r line; do
                  safe="$(printf '%s' "$line" | tr -d '\r' | sed 's/::/: :/g' | cut -c1-500)"
                  echo "::error file=src-tauri,title=cargo ${triple}::${safe}"
                done
              true
            fi
          }

          set +e
          # APK-3：仅预构建 aarch64 单架构
          build aarch64-linux-android    aarch64-linux-android24-clang

          if [ "$failed" -ne 0 ]; then
            echo "prebuild-failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload pre-build logs
        if: steps.prebuild.outputs.prebuild-failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuild-logs
          path: src-tauri/cargo-*.log
          if-no-files-found: warn

      - name: Assert pre-build result
        if: steps.prebuild.outputs.prebuild-failed == 'true'
        run: echo "Android cargo pre-build failed; see annotations / log artifact" && exit 1

      # 开启详细日志，以便定位移动端编译具体报错；APK-3：--target aarch64 单架构
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --verbose

      # release 未配置 signingConfig，Gradle 产出 *-unsigned.apk，无法安装。
      # CI 内生成一把自签证书（仅用于内测分发，不可上架），zipalign 后
      # 用 apksigner 签名；覆盖删除 unsigned 产物，artifact 只留可安装的 APK
      - name: Sign APK
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          test -x "$BT/apksigner"

          KS="$HOME/.android/prism-ci.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
            -alias prism -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Prism, OU=Mobile, O=Prism, L=NA, ST=NA, C=CN"

          find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" -type f \
            | while IFS= read -r apk; do
              ALIGNED="${apk%-unsigned.apk}-aligned.apk"
              SIGNED="${apk%-unsigned.apk}.apk"
              "$BT/zipalign" -p -f 4 "$apk" "$ALIGNED"
              "$BT/apksigner" sign --ks "$KS" \
                --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias prism --out "$SIGNED" "$ALIGNED"
              rm -f "$apk" "$ALIGNED"
              "$BT/apksigner" verify --print-certs "$SIGNED" | head -3
              echo "signed: $SIGNED"
            done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # tag 构建时把 APK 作为 Release asset 上传（与桌面端 build.yml 共用同一 Release）
      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # iOS 无 sidecar：geoip/geosite 数据库作为 bundle resources 随包分发
      # （tauri.ios.conf.json resources；内核启动时从 resource_dir 拷贝到工作目录）
      - name: Fetch geo databases
        run: node scripts/fetch-kernel.cjs --geo-only

      # iOS 内核内嵌：sing-box 编译为 c-archive 静态库，
      # src-tauri/build.rs 在 iOS target 下链接 libprismkernel.a，
      # Rust 侧经 FFI 调用（src-tauri/src/core/kernel.rs mobile_ffi）
      - name: Build embedded iOS kernel
        working-directory: src-tauri/ios-kernel
        shell: bash
        run: |
          set -e
          go mod tidy
          # FFI 导出依赖 import "C"，cgo 必须开启；netgo 强制纯 Go DNS 解析器，
          # 去除 go.o 对 libresolv（res_9_*）的引用——否则 xcodebuild 归档
          # 链接 libapp.a 时报 Undefined symbols（build.rs 的 -lresolv 管不到
          # Xcode 工程链接参数）
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CC="$(xcrun -sdk iphoneos --find clang)" \
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
          CGO_LDFLAGS="-isysroot $SDK -arch arm64" \
          go build -buildmode=c-archive \
            -tags "netgo,with_gvisor,with_quic,with_grpc,with_wireguard,with_ech,with_utls,with_clash_api" \
            -trimpath -ldflags="-s -w" \
            -o libprismkernel.a .
          ls -lh libprismkernel.a libprismkernel.h

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init

      # tauri ios init 只放置模板自带 Tauri 图标，不会把 src-tauri/icons/ios
      # 同步进 gen 工程；init 完成后把暂存区图标覆盖进 AppIcon.appiconset
      # （文件名与模板 Contents.json 一一对应）
      - name: Sync iOS app icons
        shell: bash
        run: |
          set -e
          ICONSET=$(find src-tauri/gen/apple -type d -name AppIcon.appiconset | head -1)
          test -n "$ICONSET"
          echo "appiconset: $ICONSET"
          cp -fv src-tauri/icons/ios/*.png "$ICONSET"/
          echo "icons synced: $(ls "$ICONSET"/*.png | wc -l | tr -d ' ')"

      # 注入系统 VPN 网络扩展（PacketTunnelProvider target + 主 App 隧道控制器）
      - name: Inject iOS VPN extension
        run: |
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby scripts/inject-ios-vpn.rb

      # 官方未签名路径（CLI 2.12+）：--no-sign 先构建未签名 archive，
      # 再直接从 archive 内的 .app 产出未签名 IPA；
      # 不经过 exportArchive，因此无需任何证书/描述文件
      - name: Build unsigned IPA
        run: npx tauri ios build --no-sign --verbose

      - name: Prepare TrollStore IPA
        id: ipa
        run: |
          set -e
          IPA=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -1)
          test -n "$IPA"
          echo "built ipa: $IPA"

          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          APPEX=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -type d 2>/dev/null | head -1)
          APPEX_EXEC=""
          if [ -n "$APPEX" ]; then
            APPEX_EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX/Info.plist" 2>/dev/null || true)
          fi
          echo "app: $APP  exec: $EXEC  appex: $APPEX"

          # ==================== 1. 深度清理（必须在签名前）====================
          # 注：appex 的 _CodeSignature 由下方 v4 流程显式删除（对齐
          # FlClash 终态：TrollStore 重签后不重建 CodeResources，设备上
          # 「存在但失配」的 seal 会被 pkd 拒绝，「缺失」则不校验）。
          # codesign --force 会覆盖旧签名，主程序不需要预删除。

          # 严禁插件自带动态库，必须使用主程序库
          if [ -n "$APPEX" ]; then
            rm -rf "$APPEX/Frameworks"
            echo "Removed appex Frameworks (if any)"
          fi

          # 删除冗余的 Swift 库（仅保留 libswift_Concurrency.dylib
          # 供 iOS<15 back-deploy；其余 15 个走 /usr/lib/swift）
          find "$APP" -name "*.dylib.original" -delete -print
          find "$APP/Frameworks" -maxdepth 1 -type f -name "libswift*.dylib" \
            ! -name "libswift_Concurrency.dylib" -delete -print 2>/dev/null || true
          if [ ! -f "$APP/Frameworks/libswift_Concurrency.dylib" ]; then
            echo "::error::archive did not contain back-deploy libswift_Concurrency.dylib"
            exit 1
          fi
          echo "--- Frameworks swift libs (expect only _Concurrency) ---"
          ls -1 "$APP/Frameworks"/libswift*.dylib

          # geoip/geosite 编译期内嵌校验
          for f in geoip.db geosite.db; do
            if [ ! -f "src-tauri/binaries/$f" ]; then
              echo "::error::$f missing from src-tauri/binaries (compile-time embedding source)"
              exit 1
            fi
            echo "embedded source: $f ($(du -h "src-tauri/binaries/$f" | cut -f1))"
          done

          # ==================== 2. 属性对齐（必须在签名前）====================
          # 版本号以 Cargo.toml 为唯一权威源（ipa-8：杜绝 Info.plist 初始版本
          # 与 crate 版本漂移导致设置页 APP 版本显示错误）
          APP_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          # 纯数字构建流水号（Apple 规范禁止 CFBundleVersion 含字母）
          # 以 200 为基数叠加 CI 流水号，保证单调递增且不低于历史版本
          RUN_NUM=${GITHUB_RUN_NUMBER:-$(date +%s)}
          BUILD_NUM=$((200 + RUN_NUM))
          MAIN_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")

          # 主程序
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP/Info.plist"

          if [ -n "$APPEX" ]; then
            # 核心：大版本、小版本与主程序一字不差
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$APPEX/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APPEX/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$APPEX/Info.plist"
            # 主副包营销版本一致性兜底（build 169 方案）：从主程序
            # Info.plist 读回实际值强制写入 appex——杜绝 pkd 因主副包
            # CFBundleShortVersionString 漂移而拒载副包
            SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT_VER" "$APPEX/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $SHORT_VER" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $MAIN_BUNDLE.PrismVPN" "$APPEX/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" "$APPEX/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 14.0" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType XPC!" "$APPEX/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string XPC!" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPointIdentifier com.apple.networkextension.packet-tunnel" "$APPEX/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPrincipalClass PrismVPN.PacketTunnelProvider" "$APPEX/Info.plist" 2>/dev/null || true
            echo "AppEx: ver=$BUILD_NUM pkg=XPC! id=$MAIN_BUNDLE.PrismVPN minOS=14.0"
          fi
          echo "build tag: $BUILD_NUM"

          # ==================== 3. RPATH 重排（仅限主程序！）====================
          # /usr/lib/swift 必须排在所有 @rpath 之前，否则 iOS 16.5 先
          # 命中 back-deploy 嵌入副本触发 checkVersion abort。
          #
          # 【关键】绝对不可对 appex 使用 install_name_tool！
          # appex 由 Xcode 原生编译，Mach-O header 非常紧凑（无 padding），
          # install_name_tool 修改 RPATH 会越界写坏 header，amfid 静态
          # 判定为"格式损坏的无效二进制"直接拉黑——无崩溃日志、
          # Code 14、红色"需要更新"、配置丢失。
          MAIN_EXEC_PATH="$APP/$EXEC"
          chmod +x "$MAIN_EXEC_PATH"
          echo "Rewriting rpaths for: $MAIN_EXEC_PATH"
          RPATHS_RAW=$(mktemp)
          otool -l "$MAIN_EXEC_PATH" | awk '
            /cmd LC_RPATH/ { want=1; next }
            want && /path / { sub(/^ *path /,""); sub(/ \(offset [0-9]+\).*/,""); print; want=0 }
          ' > "$RPATHS_RAW"
          echo "--- rpaths before rewrite ---"; cat "$RPATHS_RAW"
          while IFS= read -r rp; do
            install_name_tool -delete_rpath "$rp" "$MAIN_EXEC_PATH"
          done < "$RPATHS_RAW"
          install_name_tool -add_rpath /usr/lib/swift "$MAIN_EXEC_PATH"
          while IFS= read -r rp; do
            [ "$rp" = "/usr/lib/swift" ] && continue
            install_name_tool -add_rpath "$rp" "$MAIN_EXEC_PATH"
          done < "$RPATHS_RAW"
          echo "--- rpaths after rewrite ---"
          otool -l "$MAIN_EXEC_PATH" | grep -A2 LC_RPATH | grep path

          # ==================== 3.2 appex RPATH 校验（防回归）====================
          # appex 的 /usr/lib/swift 置顶由 inject-ios-vpn.rb 编译期写入
          # （LD_RUNPATH_SEARCH_PATHS），此处只校验不重写——appex 是 Xcode
          # 直编的紧凑 Mach-O，install_name_tool 会越界写坏 header
          # （amfid 判定格式损坏 → code 14，build 133 教训）。
          # 缺 /usr/lib/swift 置顶时扩展在 main() 之前 dyld 崩溃 → code=12。
          if [ -n "$APPEX" ] && [ -n "$APPEX_EXEC" ]; then
            APPEX_FIRST_RPATH=$(otool -l "$APPEX/$APPEX_EXEC" | awk '
              /cmd LC_RPATH/ { want=1; next }
              want && /path / { sub(/^ *path /,""); sub(/ \(offset [0-9]+\).*/,""); print; exit }
            ')
            echo "appex first rpath: $APPEX_FIRST_RPATH"
            if [ "$APPEX_FIRST_RPATH" != "/usr/lib/swift" ]; then
              echo "::error::appex first LC_RPATH must be /usr/lib/swift, got: $APPEX_FIRST_RPATH (check inject-ios-vpn.rb LD_RUNPATH_SEARCH_PATHS)"
              exit 1
            fi
          fi

          # ==================== 3.5 编译 PrismHelper（随包 root helper）====
          # 主 App 在设备上以 root persona（persona-mgmt + no-sandbox）
          # spawn 它，以 root 身份修复 Bundle 属主（_installd 33:33）并
          # 用 LSApplicationWorkspace 强扭注册 VPN 扩展
          # （registerApplicationDictionary: + registerPlugin:）。
          #
          # 为什么必须是 Mach-O 而非 shell 脚本（build 137 实证）：
          # AMFI 严禁 posix_spawn 执行非 Mach-O 的 .sh（EPERM，spawn=1）。
          #
          # 为什么签名必须带 entitlements（build 133-136 教训）：
          # helper 以 root 身份脱离沙盒执行 LSApplicationWorkspace 注册，
          # 裸签（无 platform-application/no-sandbox）会被系统拦截。
          # 因此在步骤 4 的签名循环中用主 App 同款 TrollStore.entitlements
          # 签名（见下方 PrismHelper 分支）。
          #
          # 动态链接系统 Swift stdlib（Xcode 16 起已移除 -static-stdlib 对
          # Apple 平台的支持，build 133 由此静默丢 helper）：libswiftCore/
          # Foundation 等自 iOS 13 起在 dyld 共享缓存与 SDK tbd stub 中。
          # swiftc 不接受裸 -rpath（clang 专属参数，build 134 由此失败），
          # 必须经 -Xlinker 双参传递。
          # -parse-as-library 必须加（build 141 实证）：swiftc 单文件编译
          # 默认脚本模式（文件即 main 文件），与源码内 @main struct 冲突，
          # 报 "'main' attribute cannot be used in a module that contains
          # top-level code"；库模式下入口由 @main 提供。
          HELPER_SRC="$PWD/src-tauri/mobile-src/ios/Helper/PrismHelper.swift"
          HELPER_BIN="$APP/PrismHelper"
          if xcrun -sdk iphoneos swiftc -O \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -framework Foundation -framework CoreServices -framework Security \
            -o "$HELPER_BIN" "$HELPER_SRC" 2>&1; then
            chmod +x "$HELPER_BIN"
            file "$HELPER_BIN"
            echo "PrismHelper compiled: $(du -h "$HELPER_BIN" | cut -f1)"
          else
            echo "::error::PrismHelper compile failed (required for pkd plugin registration)"
            exit 1
          fi
          # helper（若存在）会被步骤 4 的 Mach-O 循环自动 codesign 并入主 App seal

          # ==================== 4. 最终签名封印（必须在所有修改完成后）====================
          # 所有文件修改（Info.plist / RPATH / dylib 删除）已完成，
          # 现在对最终的文件状态用 codesign 统一签名。
          # 不再使用 ldid：codesign 单次签名即可同时保证二进制 entitlements
          # 与 CodeResources seal 一致（ldid 会破坏这种一致性，详见下方）。
          LIST=$(mktemp)
          find "$APP" -type f | while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then echo "$f"; fi
          done > "$LIST"
          echo "mach-o count: $(wc -l < "$LIST" | tr -d ' ')"

          while IFS= read -r bin; do
            # appex 主二进制在下方单独签（嵌入 entitlements，不生成
            # CodeResources）；appex 内其余 Mach-O 无需 CI 签名，
            # TrollStore 安装时会统一重签
            if [[ "$bin" == *".appex/"* ]]; then
              continue
            fi
            if [ "$bin" = "$APP/$EXEC" ]; then
              codesign --force --sign - \
                --entitlements "$PWD/src-tauri/TrollStore.entitlements.plist" \
                "$bin"
            elif [ "$bin" = "$APP/PrismHelper" ]; then
              # helper 以 root 身份脱离沙盒执行 LSApplicationWorkspace
              # 注册：必须与主 App 同款 entitlements（platform-application
              # + no-sandbox + persona-mgmt），裸签会被系统拦截；
              # --generate-entitlement-der 写入 DER 流（iOS 16 AMFI 校验）
              codesign --force --sign - \
                --entitlements "$PWD/src-tauri/TrollStore.entitlements.plist" \
                --generate-entitlement-der \
                "$bin"
            else
              codesign --force --sign - "$bin"
            fi
          done < "$LIST"

          # 对 appex 只签【二进制文件】，不生成、不保留 CodeResources：
          #
          # 【v4 FlClash 终态对齐】
          #   v1 只签二进制无 seal；v2 codesign 目录 + ldid 重签二进制
          #   （seal 失配）；v3 codesign 单次签目录（seal 一致）——三者
          #   真机全部 code=14，且同一校验 API 对同一目标两次安装分别
          #   返回 -67061 / -50，说明 seal 理论无法解释失败。
          #   已验证可用的 FlClash（TrollStore NE 项目）其 appex 安装后
          #   终态就是【无 CodeResources】：TrollStore 安装时对每个
          #   Mach-O 重签（CoreTrust bypass）但【不会重建】CodeResources，
          #   CI 侧生成的 CodeResources 在设备上必然与重签后的二进制
          #   hash 不一致；pkd 对「存在但失配」的 seal 拒绝注册（code=14），
          #   对「缺失」的 seal 不校验 —— 因此必须让它不存在。
          if [ -n "$APPEX" ] && [ -n "$APPEX_EXEC" ]; then
            chmod +x "$APPEX/$APPEX_EXEC"
            # 只签二进制文件：entitlements 嵌入 LC_CODE_SIGNATURE，
            # TrollStore 安装时用 dumpEntitlementsFromBinaryAtPath 提取
            # 后保留重签，因此 CI 侧必须先把 entitlements 嵌好
            codesign --force --sign - \
              --entitlements "$PWD/src-tauri/gen/apple/PrismVPN/PrismVPN.entitlements.plist" \
              "$APPEX/$APPEX_EXEC"
            # 移除 xcodebuild / 历史步骤遗留的 seal，杜绝 stale CodeResources
            rm -rf "$APPEX/_CodeSignature"
            echo "--- appex binary codesign (no CodeResources, FlClash-style): $APPEX ---"
            if [ -e "$APPEX/_CodeSignature" ]; then
              echo "::error::appex _CodeSignature still present (must be absent)"; exit 1
            fi
            # 确认 entitlements 真实嵌入二进制（读取内嵌 superblob，
            # 与 CodeResources 无关）
            if codesign -d --entitlements - "$APPEX/$APPEX_EXEC" 2>&1 | grep -q "networkextension"; then
              echo "appex embedded entitlements: OK"
            else
              echo "::error::appex binary missing networkextension entitlement"; exit 1
            fi
          fi

          echo "--- main executable entitlements ---"
          codesign -d --entitlements - "$APP/$EXEC" 2>&1 | head -40 || true

          # embedded.mobileprovision 一律不打包：TrollStore 用 CoreTrust
          # 假根证书重签，残留 profile 会让 pkd/installd 的 profile-签名
          # 一致性检查失败拒绝扩展（生态内可用应用均不带 profile）。
          # （原 4.5 自签 profile 生成步骤已删除）
          rm -f "$APP/embedded.mobileprovision" "$APPEX/embedded.mobileprovision" 2>/dev/null || true

          # ==================== 硬校验（签名后只读检查）====================

          # 0: VPN 扩展必须真的打进 PlugIns
          if [ -z "$APPEX" ]; then
            echo "::error::PrismVPN.appex missing from PlugIns"
            exit 1
          fi
          EP=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX/Info.plist" 2>/dev/null || true)
          # 扩展点标识 = com.apple.networkextension.packet-tunnel（无
          # -provider 后缀；WireGuard 官方 Info.plist 同款）。带后缀的
          # 是 entitlements 数组值，两者易混——写错扩展点 pkd 按点查找
          # 永远落空，code 14 "not installed"（build 1-119 的根因）。
          if [ "$EP" != "com.apple.networkextension.packet-tunnel" ]; then
            echo "::error::appex NSExtensionPointIdentifier wrong: '$EP'"
            exit 1
          fi
          # 0.5: embedded.mobileprovision 必须不存在（TrollStore 用
          # CoreTrust 假根证书重签为 TROLLTROLL.*，残留 profile 会让
          # pkd/installd 的 profile-签名一致性检查失败拒绝扩展）
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::main app must NOT contain embedded.mobileprovision (TrollStore sign conflict)"
            exit 1
          fi
          if [ -f "$APPEX/embedded.mobileprovision" ]; then
            echo "::error::appex must NOT contain embedded.mobileprovision (TrollStore sign conflict)"
            exit 1
          fi
          echo "embedded.mobileprovision absent: app+appex OK"
          # 扩展二进制必须内嵌 packet-tunnel-provider entitlement
          # 注意：codesign -d --entitlements - 的 plist 输出在 stderr，
          # 必须 2>&1 合并后再 grep；旧代码用 2>/dev/null + $LDID（ldid
          # 已移除，变量为空）导致命令不存在、grep 误报"lacks entitlement"。
          codesign -d --entitlements - "$APPEX/$APPEX_EXEC" 2>&1 \
            | grep -q "packet-tunnel-provider" || {
            echo "::error::appex binary lacks packet-tunnel-provider entitlement"
            exit 1
          }
          # 主 App + 扩展都必须内嵌相同的 App Group
          codesign -d --entitlements - "$APP/$EXEC" 2>&1 \
            | grep -q "group.com.prism.proxy" || {
            echo "::error::main app lacks application-groups entitlement"
            exit 1
          }
          codesign -d --entitlements - "$APPEX/$APPEX_EXEC" 2>&1 \
            | grep -q "group.com.prism.proxy" || {
            echo "::error::appex lacks application-groups entitlement"
            exit 1
          }
          # Team Prefix 必须一致
          codesign -d --entitlements - "$APPEX/$APPEX_EXEC" 2>&1 \
            | grep -q "TROLLTROLL.com.prism.proxy.PrismVPN" || {
            echo "::error::appex application-identifier team prefix mismatches"
            exit 1
          }
          echo "appex OK: point=$EP entitlement=present group=present team=matched"

          # 1: /usr/lib/swift 必须是第一条 LC_RPATH
          FIRST_RPATH=$(otool -l "$APP/$EXEC" | awk '
            /cmd LC_RPATH/ { want=1; next }
            want && /path / { sub(/^ *path /,""); sub(/ \(offset [0-9]+\).*/,""); print; exit }
          ')
          echo "first LC_RPATH: $FIRST_RPATH"
          if [ "$FIRST_RPATH" != "/usr/lib/swift" ]; then
            echo "::error::first LC_RPATH must be /usr/lib/swift (got '$FIRST_RPATH')"
            exit 1
          fi

          # 2: 无受限 entitlement（避免要求开发者模式）
          bad=0
          while IFS= read -r bin; do
            ents=$(codesign -d --entitlements - "$bin" 2>&1 || true)
            if echo "$ents" | grep -qE 'get-task-allow|task_for_pid-allow|com\.apple\.private\.cs\.debugger|com\.apple\.system-task-ports'; then
              echo "::error file=${bin#$PWD/}::restricted developer-mode entitlement present"
              bad=1
            fi
          done < "$LIST"
          if [ "$bad" -ne 0 ]; then
            echo "TrollStore IPA would require Developer Mode; aborting"
            exit 1
          fi
          echo "no restricted entitlements; Developer Mode not required"

          # 3: Swift 运行时引用解析
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SYS_SWIFT="$SDK_PATH/usr/lib/swift"
          echo "sdk swift stub dir: $SYS_SWIFT ($(ls -1 "$SYS_SWIFT" 2>/dev/null | wc -l | tr -d ' ') entries)"
          unresolved=0
          while IFS= read -r bin; do
            otool -L "$bin" 2>/dev/null \
              | grep -oE '@rpath/libswift[A-Za-z0-9_.]*\.dylib' | sort -u \
              | while IFS= read -r ref; do
                  lib="${ref#@rpath/}"
                  if [ -f "$APP/Frameworks/$lib" ]; then
                    echo "embedded (old-OS fallback): $lib"
                    continue
                  fi
                  if ls "$SYS_SWIFT/${lib%.dylib}.tbd" "$SYS_SWIFT/$lib" \
                       >/dev/null 2>&1; then
                    echo "system-provided swift lib: $lib"
                    continue
                  fi
                  case "$lib" in
                    libswiftCore.dylib|\
                    libswiftDataDetection.dylib|\
                    libswiftOSLog.dylib|\
                    libswiftUniformTypeIdentifiers.dylib|\
                    libswiftXPC.dylib)
                      echo "dyld-shared-cache resident (no SDK stub): $lib"
                      ;;
                    *)
                      echo "::error file=${bin#$PWD/}::$lib neither embedded, SDK stub, nor known OS-resident swift lib"
                      exit 1
                      ;;
                  esac
                done || unresolved=1
          done < "$LIST"
          if [ "$unresolved" -ne 0 ]; then
            echo "Swift runtime resolution unverified; aborting"
            exit 1
          fi
          echo "all referenced Swift runtime libraries resolve (system-first rpath)"

          # ==================== 5. 压缩出包 ====================
          # install_name_tool / ldid 可能丢失 +x，zip 前强制恢复
          chmod +x "$APP/$EXEC"
          find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -type d | while IFS= read -r appex; do
            chmod +x "$appex/$(plutil -extract CFBundleExecutable raw "$appex/Info.plist")"
          done

          OUT="$PWD/Prism-$APP_VERSION-TrollStore.ipa"
          rm -f "$OUT"
          (cd "$WORK" && zip -qry "$OUT" Payload)
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-TrollStore-ipa
          path: Prism-*-TrollStore.ipa
          if-no-files-found: error

      # tag 构建时把 IPA 作为 Release asset 上传（与桌面端共用同一 Release）
      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Prism-*-TrollStore.ipa
